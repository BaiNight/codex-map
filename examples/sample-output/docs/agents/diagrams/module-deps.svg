<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 980" width="1540" height="980">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #e6edf3; font: 700 22px "Segoe UI","Microsoft YaHei",sans-serif; }
      .sub { fill: #8b949e; font: 12px "Segoe UI","Microsoft YaHei",sans-serif; }
      .sec { fill: #8b949e; font: 600 11px "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: .08em; }
      .n { fill: #e6edf3; font: 600 12px "Segoe UI","Microsoft YaHei",sans-serif; }
      .d { fill: #8b949e; font: 11px "Segoe UI","Microsoft YaHei",sans-serif; }
      .hint { fill: #6e7681; font: 10px "Segoe UI","Microsoft YaHei",sans-serif; }
      .lane { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .ok { stroke: #58a6ff; stroke-width: 1.6; fill: none; marker-end: url(#ahb); }
      .ok-wire { stroke: #58a6ff; stroke-width: 1.6; fill: none; }
      .cyc { stroke: #f85149; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
      .cyc-wire { stroke: #f85149; stroke-width: 1.8; fill: none; }
      .cyc-bi { stroke: #f85149; stroke-width: 1.8; fill: none; marker-start: url(#ahs); marker-end: url(#ahr); }
      .rail { stroke: #21262d; stroke-width: 8; fill: none; stroke-linecap: round; }
      .leg { fill: #e6edf3; font: 11px "Segoe UI","Microsoft YaHei",sans-serif; }
      .lab { fill: #6e7681; font: 9px "Segoe UI","Microsoft YaHei",sans-serif; }
    </style>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect class="bg" width="1540" height="980"/>
  <text class="title" x="32" y="36">OMS 内部模块依赖</text>
  <text class="sub" x="32" y="56">只画本仓库目录边界 · 第三方包不画 · 红色 = 循环依赖（use 反向引用）</text>
  <line class="ok" x1="1080" y1="32" x2="1140" y2="32"/>
  <text class="leg" x="1148" y="36">单向依赖</text>
  <line class="cyc-bi" x1="1280" y1="32" x2="1340" y2="32"/>
  <text class="leg" x="1348" y="36">循环依赖</text>

  <!-- entry -->
  <rect class="lane" x="24" y="76" width="988" height="120" rx="10"/>
  <text class="sec" x="40" y="96">应用入口</text>
  <g>
    <rect x="48" y="112" width="300" height="68" rx="8" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="64" y="138">backend/modules/v1/controllers</text>
    <text class="d" x="64" y="158">HTTP API 入口 (order/expense/…)</text>
  </g>
  <g>
    <rect x="372" y="112" width="300" height="68" rx="8" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="388" y="138">backend/modules/v1/consumer</text>
    <text class="d" x="388" y="158">RabbitMQ 消费者</text>
  </g>
  <g>
    <rect x="696" y="112" width="300" height="68" rx="8" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="712" y="138">console/controllers</text>
    <text class="d" x="712" y="158">CLI：费用重算、平台结算、ES 同步</text>
  </g>

  <rect class="lane" x="1032" y="76" width="484" height="120" rx="10"/>
  <g>
    <rect x="1048" y="112" width="452" height="68" rx="8" fill="#161b22" stroke="#6e7681" stroke-dasharray="4 3"/>
    <text class="n" x="1064" y="138">backend/modules/v2</text>
    <text class="d" x="1064" y="158">仅 v2.php Module，无 controllers</text>
  </g>

  <!-- v1 stack -->
  <rect class="lane" x="24" y="220" width="988" height="400" rx="10"/>
  <text class="sec" x="40" y="240">backend/modules/v1 内部</text>
  <g>
    <rect x="48" y="256" width="948" height="56" rx="8" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="64" y="276">service（含 external / order / expense / mongo / amazon / batch…）</text>
    <text class="d" x="64" y="296">业务编排； Oms::$service 由 common/config/services 注册</text>
  </g>
  <g>
    <rect x="48" y="336" width="300" height="56" rx="8" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="64" y="356">strategy + task</text>
    <text class="d" x="64" y="376">费用/利润策略与 pipeline</text>
  </g>
  <g>
    <rect x="372" y="336" width="300" height="56" rx="8" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="388" y="356">slice</text>
    <text class="d" x="388" y="376">列表/报表查询切片</text>
  </g>
  <g>
    <rect x="696" y="336" width="300" height="56" rx="8" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="712" y="356">domain + enums</text>
    <text class="d" x="712" y="376">BO/VO 与平台/订单枚举</text>
  </g>
  <g>
    <rect x="48" y="416" width="948" height="48" rx="8" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="64" y="436">repository</text>
    <text class="d" x="64" y="454">访问 backend/models（mysql / mongo / es / olap / irb）</text>
  </g>
  <text class="sec" x="40" y="488">backend/models</text>
  <g>
    <rect x="48" y="500" width="948" height="52" rx="8" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="64" y="520">order / expense / refund / exchange / amazon / mongo / es / olap / irb / log / base</text>
    <text class="d" x="64" y="538">ActiveRecord；irb 走 shdb，olap 走 apdb/dwdb</text>
  </g>

  <!-- common stack, y-aligned with v1 -->
  <rect class="lane" x="1032" y="220" width="484" height="400" rx="10"/>
  <text class="sec" x="1048" y="240">common（被 backend/console 依赖）</text>
  <g>
    <rect x="1048" y="256" width="452" height="80" rx="8" fill="#2a1616" stroke="#f85149"/>
    <text class="n" x="1064" y="280">common/platform</text>
    <text class="d" x="1064" y="300">拉单/检测/标发适配</text>
    <text class="d" x="1064" y="316">反向 use 了 models 与 v1 enums/domain</text>
  </g>
  <g>
    <rect x="1048" y="352" width="452" height="56" rx="8" fill="#2a1616" stroke="#f85149"/>
    <text class="n" x="1064" y="372">common/config</text>
    <text class="d" x="1064" y="390">services/external/slices 直接绑定 v1 类名</text>
  </g>
  <g>
    <rect x="1048" y="424" width="452" height="56" rx="8" fill="#241c33" stroke="#a371f7"/>
    <text class="n" x="1064" y="444">common/launcher</text>
    <text class="d" x="1064" y="462">出站 HTTP；少量 request 引用 v1 enums</text>
  </g>
  <g>
    <rect x="1048" y="500" width="452" height="52" rx="8" fill="#241c33" stroke="#a371f7"/>
    <text class="n" x="1064" y="520">tools / es / db / helper / state / aliyun</text>
    <text class="d" x="1064" y="538">基础设施封装，原则上不应依赖 backend</text>
  </g>

  <!-- gap rails (visual only, no arrows) -->
  <path class="rail" d="M 1016 256 V 560"/>
  <path class="rail" d="M 1026 256 V 560"/>
  <text class="lab" x="1006" y="248">v1 → common</text>
  <text class="lab" x="1006" y="574">循环回边</text>

  <!-- column 198 / 522 / 846 : entry -> service -> mid -> repository -> models -->
  <path class="ok" d="M 198 180 V 256"/>
  <path class="ok" d="M 522 180 V 256"/>
  <path class="ok" d="M 846 180 V 256"/>
  <path class="ok" d="M 198 312 V 336"/>
  <path class="ok" d="M 522 312 V 336"/>
  <path class="ok" d="M 846 312 V 336"/>
  <path class="ok" d="M 198 392 V 416"/>
  <path class="ok" d="M 522 392 V 416"/>
  <path class="ok" d="M 846 392 V 416"/>
  <path class="ok" d="M 522 464 V 500"/>

  <!-- blue bus: spine + two right taps (arrow only on taps) -->
  <path class="ok-wire" d="M 996 284 H 1016 V 526"/>
  <path class="ok" d="M 1016 452 H 1048"/>
  <path class="ok" d="M 1016 526 H 1048"/>

  <!-- red: service <-> platform, own row -->
  <path class="cyc-bi" d="M 996 270 H 1048"/>
  <!-- red spine (no arrowheads) + short stubs -->
  <path class="cyc-wire" d="M 1026 298 V 512"/>
  <path class="cyc-bi" d="M 1048 320 H 1026"/>
  <path class="cyc-bi" d="M 996 364 H 1026"/>
  <path class="cyc" d="M 1048 380 H 1026"/>
  <path class="cyc" d="M 1026 298 H 996"/>
  <path class="cyc-bi" d="M 996 512 H 1026"/>

  <!-- notes -->
  <rect class="lane" x="24" y="644" width="1492" height="312" rx="10"/>
  <text class="sec" x="40" y="668">循环依赖说明（已用源码 use 核对）</text>
  <rect x="48" y="686" width="712" height="248" rx="8" fill="#1a1010" stroke="#f85149"/>
  <text class="n" x="64" y="712">红环 1：v1 ↔ common/platform</text>
  <text class="d" x="64" y="734">正向：service / strategy 调用 platform 拉单、检测、标发</text>
  <text class="d" x="64" y="752">反向：platform 大量 use backend\models 与 v1 enums/domain/repository</text>
  <text class="d" x="64" y="770">例：common/platform/temu/TemuMarkShipment.php</text>
  <text class="d" x="64" y="788">例：common/platform/traits/OrderDetectionBaseTrait.php</text>
  <text class="n" x="64" y="820">红环 2：models ↔ common/platform</text>
  <text class="d" x="64" y="842">backend/models/order/OrderLogistics.php use OrderMarkShipment</text>
  <text class="n" x="64" y="870">红环 3：common/config → v1 service（配置层环）</text>
  <text class="d" x="64" y="892">common/config/services/*、external/ExternalService.php 绑定 v1 类</text>
  <text class="d" x="64" y="910">common/config/app/components/errorHandler.php → backend\exception</text>
  <rect x="780" y="686" width="712" height="248" rx="8" fill="#0f1720" stroke="#30363d"/>
  <text class="n" x="796" y="712">非循环（保持单向即可）</text>
  <text class="d" x="796" y="734">console → backend/modules/v1 与 backend/models</text>
  <text class="d" x="796" y="752">controllers / consumer → service → repository → models</text>
  <text class="d" x="796" y="770">service → launcher / tools / es / db</text>
  <text class="d" x="796" y="788">launcher 仅少量 request 引用 v1 enums (Otto/Shein)</text>
  <text class="d" x="796" y="806">v2 无出边、无入边业务依赖</text>
  <text class="n" x="796" y="838">改代码时注意</text>
  <text class="d" x="796" y="860">不要再往 common/platform 增加 v1 service 依赖</text>
  <text class="d" x="796" y="878">新平台适配优先依赖 contract + DTO，而不是 AR</text>
  <text class="d" x="796" y="896">common/tools、es、db 应继续保持不引用 backend</text>
  <text class="hint" x="796" y="920">第三方 Composer 包不在本图</text>
</svg>
