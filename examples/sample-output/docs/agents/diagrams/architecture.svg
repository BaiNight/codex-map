<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1080" width="1640" height="1080">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #e6edf3; font: 700 22px "Segoe UI","Microsoft YaHei",sans-serif; }
      .sub { fill: #8b949e; font: 12px "Segoe UI","Microsoft YaHei",sans-serif; }
      .sec { fill: #8b949e; font: 600 11px "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: .08em; }
      .n { fill: #e6edf3; font: 600 12px "Segoe UI","Microsoft YaHei",sans-serif; }
      .d { fill: #8b949e; font: 11px "Segoe UI","Microsoft YaHei",sans-serif; }
      .hint { fill: #6e7681; font: 10px "Segoe UI","Microsoft YaHei",sans-serif; }
      .lane { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10; }
      .box { rx: 8; }
      .arr { stroke: #484f58; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>
  <rect class="bg" width="1640" height="1080"/>
  <text class="title" x="32" y="36">OMS 服务架构</text>
  <text class="sub" x="32" y="56">信诚 OMS · Yii2 Advanced · backend API + console Worker · 分层按仓库真实目录</text>

  <rect class="lane" x="24" y="76" width="1188" height="118"/>
  <text class="sec" x="40" y="96">调用方</text>
  <g>
    <rect class="box" x="40" y="108" width="216" height="70" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="52" y="132">ERP 前端 / 运营后台</text>
    <text class="d" x="52" y="152">经 Nginx 调 backend HTTP API</text>
  </g>
  <g>
    <rect class="box" x="268" y="108" width="216" height="70" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="280" y="132">内部系统</text>
    <text class="d" x="280" y="152">WMS/TMS 等走 internal 回调</text>
  </g>
  <g>
    <rect class="box" x="496" y="108" width="216" height="70" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="508" y="132">赛盒 IRB</text>
    <text class="d" x="508" y="152">saihe 接口 + shdb 历史数据</text>
  </g>
  <g>
    <rect class="box" x="724" y="108" width="216" height="70" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="736" y="132">Amazon SQS</text>
    <text class="d" x="736" y="152">通知接入 common/platform/amazon/sqs</text>
  </g>
  <g>
    <rect class="box" x="952" y="108" width="236" height="70" fill="#12233a" stroke="#388bfd"/>
    <text class="n" x="964" y="132">运维 / 定时</text>
    <text class="d" x="964" y="152">php yii … 由 Supervisor Worker 跑</text>
  </g>

  <path class="arr" d="M 618 194 L 618 214"/>

  <rect class="lane" x="24" y="216" width="1188" height="118"/>
  <text class="sec" x="40" y="236">运行时入口</text>
  <g>
    <rect class="box" x="40" y="248" width="280" height="70" fill="#1b2838" stroke="#58a6ff"/>
    <text class="n" x="52" y="272">Nginx + PHP-FPM</text>
    <text class="d" x="52" y="292">docker: nginx-oms / php-oms</text>
  </g>
  <g>
    <rect class="box" x="340" y="248" width="420" height="70" fill="#1b2838" stroke="#58a6ff"/>
    <text class="n" x="352" y="272">backend API（app-backend）</text>
    <text class="d" x="352" y="292">modules/v1 为主； v2 已注册但无 controllers</text>
  </g>
  <g>
    <rect class="box" x="780" y="248" width="408" height="70" fill="#1b2838" stroke="#58a6ff"/>
    <text class="n" x="792" y="272">console + worker-oms</text>
    <text class="d" x="792" y="292">CLI 重算/同步 + RabbitMQ Consumer</text>
  </g>

  <path class="arr" d="M 618 334 L 618 354"/>

  <rect class="lane" x="24" y="356" width="1188" height="214"/>
  <text class="sec" x="40" y="376">backend/modules/v1 核心模块（名 + 职责）</text>
  <g>
    <rect class="box" x="40" y="390" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="52" y="410">order</text>
    <text class="d" x="52" y="428">订单拉取、拆分、标发与状态</text>
  </g>
  <g>
    <rect class="box" x="272" y="390" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="284" y="410">expense</text>
    <text class="d" x="284" y="428">费用分段、结算、自定义费用</text>
  </g>
  <g>
    <rect class="box" x="504" y="390" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="516" y="410">refund</text>
    <text class="d" x="516" y="428">退款 / 退货单据处理</text>
  </g>
  <g>
    <rect class="box" x="736" y="390" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="748" y="410">exchange</text>
    <text class="d" x="748" y="428">换货流程与商品处理</text>
  </g>
  <g>
    <rect class="box" x="968" y="390" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="980" y="410">export / report</text>
    <text class="d" x="980" y="428">导出任务与利润/经营报表</text>
  </g>
  <g>
    <rect class="box" x="40" y="456" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="52" y="476">internal</text>
    <text class="d" x="52" y="494">订阅、WMS 退货、内部统计（含 subscribe）</text>
  </g>
  <g>
    <rect class="box" x="272" y="456" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="284" y="476">saihe</text>
    <text class="d" x="284" y="494">赛盒订单列表、退款与审核</text>
  </g>
  <g>
    <rect class="box" x="504" y="456" width="220" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="516" y="476">base</text>
    <text class="d" x="516" y="494">配置、字典、拆分策略、文件</text>
  </g>
  <g>
    <rect class="box" x="736" y="456" width="452" height="56" fill="#1f2a37" stroke="#79c0ff"/>
    <text class="n" x="748" y="476">编排层：controllers → service / consumer / strategy / task / slice → repository</text>
    <text class="d" x="748" y="494">HTTP、MQ、费用 pipeline 最终落到 repository + models</text>
  </g>
  <text class="hint" x="40" y="532">入口分组来自 backend/modules/v1/controllers/* · 业务编排见 service/consumer/strategy/task</text>

  <path class="arr" d="M 618 570 L 618 590"/>

  <rect class="lane" x="24" y="592" width="1188" height="118"/>
  <text class="sec" x="40" y="612">common</text>
  <g>
    <rect class="box" x="40" y="624" width="372" height="70" fill="#241c33" stroke="#a371f7"/>
    <text class="n" x="52" y="648">platform</text>
    <text class="d" x="52" y="668">平台拉单 / 检测 / 标发适配（wish 目录为空）</text>
  </g>
  <g>
    <rect class="box" x="428" y="624" width="372" height="70" fill="#241c33" stroke="#a371f7"/>
    <text class="n" x="440" y="648">launcher</text>
    <text class="d" x="440" y="668">HTTP/Nacos 调内部系统与部分平台网关</text>
  </g>
  <g>
    <rect class="box" x="816" y="624" width="372" height="70" fill="#241c33" stroke="#a371f7"/>
    <text class="n" x="828" y="648">tools / es / db / state / aliyun</text>
    <text class="d" x="828" y="668">工具、ES 封装、连接器、状态机、OSS</text>
  </g>

  <path class="arr" d="M 618 710 L 618 730"/>

  <rect class="lane" x="24" y="732" width="1188" height="150"/>
  <text class="sec" x="40" y="752">存储 / 中间件（common/config/app/components 已声明）</text>
  <g>
    <rect class="box" x="40" y="766" width="180" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="50" y="794">MySQL db · OMS 主库</text>
  </g>
  <g>
    <rect class="box" x="232" y="766" width="180" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="242" y="794">MySQL shdb · 赛盒 IRB</text>
  </g>
  <g>
    <rect class="box" x="424" y="766" width="180" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="434" y="794">MySQL apdb · 产品分析</text>
  </g>
  <g>
    <rect class="box" x="616" y="766" width="180" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="626" y="794">MySQL dwdb · 数仓</text>
  </g>
  <g>
    <rect class="box" x="808" y="766" width="180" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="818" y="786">MongoDB</text>
    <text class="d" x="818" y="802">平台原始单 / 财务</text>
  </g>
  <g>
    <rect class="box" x="1000" y="766" width="188" height="48" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="1010" y="786">Elasticsearch</text>
    <text class="d" x="1010" y="802">订单检索</text>
  </g>
  <g>
    <rect class="box" x="40" y="822" width="180" height="44" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="50" y="848">Redis ×2</text>
  </g>
  <g>
    <rect class="box" x="232" y="822" width="180" height="44" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="242" y="848">RabbitMQ</text>
  </g>
  <g>
    <rect class="box" x="424" y="822" width="180" height="44" fill="#12261c" stroke="#3fb950"/>
    <text class="n" x="434" y="848">Aliyun OSS</text>
  </g>
  <g>
    <rect class="box" x="616" y="822" width="180" height="44" fill="#12261c" stroke="#6e7681" stroke-dasharray="4 3"/>
    <text class="n" x="626" y="848">ClickHouse*</text>
  </g>
  <g>
    <rect class="box" x="808" y="822" width="180" height="44" fill="#12261c" stroke="#6e7681" stroke-dasharray="4 3"/>
    <text class="n" x="818" y="848">TiDB*</text>
  </g>
  <text class="hint" x="1000" y="848">* 仅配置，业务引用待确认</text>

  <path class="arr" d="M 618 882 L 618 902"/>

  <rect class="lane" x="24" y="904" width="1188" height="152"/>
  <text class="sec" x="40" y="924">外部系统</text>
  <g>
    <rect class="box" x="40" y="938" width="372" height="100" fill="#2a1f14" stroke="#f0883e"/>
    <text class="n" x="52" y="962">电商平台 API</text>
    <text class="d" x="52" y="982">Amazon SP-API / SQS、eBay SDK</text>
    <text class="d" x="52" y="998">Walmart / Otto / Temu / Shein / Kaufland / 行盘 等经 launcher</text>
    <text class="d" x="52" y="1014">Allegro / Lazada / Shopee / TikTok / AE 走 platform</text>
  </g>
  <g>
    <rect class="box" x="428" y="938" width="372" height="100" fill="#2a1f14" stroke="#f0883e"/>
    <text class="n" x="440" y="962">内部 ERP 服务（launcher）</text>
    <text class="d" x="440" y="982">xc_wms / xc_tms / xc_goods / xc_auth</text>
    <text class="d" x="440" y="998">xc_base / xc_pms / xc_tc / xc_crm / xc_publish</text>
    <text class="d" x="440" y="1014">xc_tool / erp-im / xc_ai_refund / xc_dexh</text>
  </g>
  <g>
    <rect class="box" x="816" y="938" width="372" height="100" fill="#2a1f14" stroke="#f0883e"/>
    <text class="n" x="828" y="962">其它外部</text>
    <text class="d" x="828" y="982">领星 LingXing、飞书 Feishu</text>
    <text class="d" x="828" y="998">Nacos 服务发现 (erp-auth / erp-im)</text>
    <text class="d" x="828" y="1014">赛盒数据面见 shdb + saihe</text>
  </g>

  <rect class="lane" x="1232" y="76" width="384" height="980"/>
  <text class="sec" x="1248" y="96">周边基础设施</text>
  <g>
    <rect class="box" x="1248" y="112" width="352" height="900" fill="#161b22" stroke="#6e7681"/>
    <text class="n" x="1264" y="140">日志</text>
    <text class="d" x="1264" y="160">yii\log\FileTarget · runtime/logs</text>
    <text class="d" x="1264" y="176">SQL 另写 sql-console.log</text>
    <text class="d" x="1264" y="192">trace_id 前缀 (YiiTrace Bootstrap)</text>
    <text class="n" x="1264" y="228">链路追踪</text>
    <text class="d" x="1264" y="248">SkyWalking PHP Agent</text>
    <text class="d" x="1264" y="264">docker/conf/php/php/skywalking_agent_*.ini</text>
    <text class="d" x="1264" y="280">xincheng/yii-trace 引导注入</text>
    <text class="n" x="1264" y="316">错误监控</text>
    <text class="d" x="1264" y="336">composer: notamedia/yii2-sentry</text>
    <text class="d" x="1264" y="352">config 中未见 SentryTarget · 待确认</text>
    <text class="n" x="1264" y="388">配置 / 发现</text>
    <text class="d" x="1264" y="408">env + common/config/app/components</text>
    <text class="d" x="1264" y="424">Launcher Nacos / mes_nacos</text>
    <text class="n" x="1264" y="460">进程模型</text>
    <text class="d" x="1264" y="480">docker-compose: nginx / php / worker</text>
    <text class="d" x="1264" y="496">supervisord 管 Consumer 与定时</text>
    <text class="n" x="1264" y="532">认证</text>
    <text class="d" x="1264" y="552">thinksvip/xc-auth · launcher xc_auth</text>
    <text class="n" x="1264" y="588">健康检查</text>
    <text class="d" x="1264" y="608">composer: xincheng/yii2-health</text>
    <text class="d" x="1264" y="624">业务引用未检索到 · 待确认</text>
    <text class="n" x="1264" y="660">异常处理</text>
    <text class="d" x="1264" y="680">backend\exception\GlobalException</text>
    <text class="d" x="1264" y="696">由 common 组件 errorHandler 挂接</text>
    <text class="n" x="1264" y="732">Redis 角色</text>
    <text class="d" x="1264" y="752">redis：业务连接 / 锁</text>
    <text class="d" x="1264" y="768">cache：yii\redis\Cache 独立实例</text>
    <text class="hint" x="1264" y="820">分层约定：调用方 → API(backend)</text>
    <text class="hint" x="1264" y="836">→ modules/v1 → common → 存储</text>
    <text class="hint" x="1264" y="852">→ 外部平台 / ERP 服务</text>
    <text class="hint" x="1264" y="884">虚线存储 = 配置有、代码引用待确认</text>
    <text class="hint" x="1264" y="916">v2 仅 Module 类，无业务入口</text>
    <text class="hint" x="1264" y="948">无独立 frontend 应用目录</text>
  </g>
</svg>
