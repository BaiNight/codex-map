<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880">
<defs>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #1f2328; font: 700 20px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .sub { fill: #656d76; font: 12px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .n { fill: #1f2328; font: 600 13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .d { fill: #656d76; font: 11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .edge { fill: #656d76; font: 11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .arr { stroke: #4a90d9; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arr-side { stroke: #9ca3af; stroke-width: 1.2; fill: none; marker-end: url(#ahg); }
  </style>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
  </marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect class="bg" width="720" height="880"/>
<text class="title" x="40" y="36">订单利润计算 L1</text>
<text class="sub" x="40" y="56">同一时间线：HTTP/CLI 投递 → Consumer → 策略 → 算子 → 上卷</text>
<g><rect x="80" y="76" width="220" height="56" rx="8" fill="#f8fbff" stroke="#4a90d9" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="98" text-anchor="middle">S1 入口收集订单</text>
<text class="d" x="190.0" y="118" text-anchor="middle">HTTP / CLI</text>
</g>
<path class="arr" d="M 190 132 L 190 164"/>
<g><rect x="80" y="164" width="220" height="56" rx="8" fill="#f8fbff" stroke="#4a90d9" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="186" text-anchor="middle">S2 加锁投递 MQ</text>
<text class="d" x="190.0" y="206" text-anchor="middle">RedLock + order.calculate</text>
</g>
<path class="arr" d="M 190 220 L 190 252"/>
<g><rect x="80" y="252" width="220" height="56" rx="8" fill="#f8fbff" stroke="#4a90d9" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="274" text-anchor="middle">S3 消费取单</text>
<text class="d" x="190.0" y="294" text-anchor="middle">OrderProfitCalculateConsumer</text>
</g>
<path class="arr" d="M 300 280 L 430 280"/>
<g><rect x="430" y="252" width="220" height="56" rx="8" fill="#ffffff" stroke="#e85d4c" stroke-width="1.6"/>
<text class="n" fill="#dc2626" x="540.0" y="274" text-anchor="middle">S8 失败延迟重试</text>
<text class="d" x="540.0" y="294" text-anchor="middle">order_profit_task</text>
</g>
<path class="arr" d="M 190 308 L 190 340"/>
<g><polygon points="190,340.0 258.0,376 190,412.0 122.0,376" fill="#ffffff" stroke="#f5a623" stroke-width="1.6"/>
<text class="n" fill="#d97706" x="190" y="372" text-anchor="middle">S4 有平台策略?</text>
<text class="d" x="190" y="390" text-anchor="middle">platform_id</text>
</g>
<text class="edge" x="204" y="428">是/兜底</text>
<path class="arr" d="M 190 412 L 190 456"/>
<g><polygon points="190,456.0 258.0,492 190,528.0 122.0,492" fill="#ffffff" stroke="#f5a623" stroke-width="1.6"/>
<text class="n" fill="#d97706" x="190" y="488" text-anchor="middle">S5 关账且能算?</text>
<text class="d" x="190" y="506" text-anchor="middle">见 L2 compute</text>
</g>
<text class="edge" x="262" y="484">是</text>
<text class="edge" x="78" y="548">否</text>
<path class="arr" d="M 190 528 L 190 572"/>
<g><rect x="80" y="572" width="220" height="56" rx="8" fill="#f8fbff" stroke="#4a90d9" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="594" text-anchor="middle">S6 费用算子管线</text>
<text class="d" x="190.0" y="614" text-anchor="middle">见 L2 compute</text>
</g>
<path class="arr" d="M 190 628 L 190 660"/>
<g><rect x="80" y="660" width="220" height="56" rx="8" fill="#f8fbff" stroke="#4a90d9" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="682" text-anchor="middle">S7 上卷写库</text>
<text class="d" x="190.0" y="702" text-anchor="middle">见 L2 persist</text>
</g>
<path class="arr" d="M 190 716 L 190 756"/>
<g><rect x="80" y="756" width="220" height="56" rx="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text class="n" fill="#1f2328" x="190.0" y="790" text-anchor="middle">结束</text>
</g>
<path class="arr-side" d="M 190 528 L 48 528 L 48 784 L 80 784"/>
<path class="arr-side" d="M 540 308 L 540 784 L 300 784"/>
</svg>
