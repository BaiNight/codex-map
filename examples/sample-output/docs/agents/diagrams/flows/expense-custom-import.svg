  <rect x="40" y="220" width="250" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="n" x="52" y="246">Slice::handler + store</text>
<text class="d" x="52" y="262">status=PENDING_REVIEW</text>
  <rect x="40" y="320" width="250" height="56" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="52" y="346">CLI CustomImportFeeHandler</text>
<text class="d" x="52" y="362">捞 import_status=0</text>
  <rect x="40" y="420" width="250" height="56" rx="8" fill="#271700" stroke="#db6d28"/>
  <text class="n" x="52" y="446">OSS getObject</text>
<text class="d" x="52" y="462">Yii::$app->oss</text>
  <rect x="40" y="520" width="250" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="n" x="52" y="546">DetailService::import</text>
<text class="d" x="52" y="562">逐行 setAttributes</text>
  <rect x="520" y="220" width="250" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="n" x="532" y="246">Slice::docImport</text>
<text class="d" x="532" y="262">事务 + importDetail</text>
  <rect x="520" y="360" width="280" height="56" rx="8" fill="#12261e" stroke="#3fb950"/>
  <text class="n" x="532" y="386">写 expense_customize_import</text>
<text class="d" x="532" y="402">expense_customize_detail</text>
  <rect x="520" y="500" width="280" height="56" rx="8" fill="#271700" stroke="#db6d28"/>
  <text class="n" x="532" y="526">MQ import_report</text>
<text class="d" x="532" y="542">仅表单路径</text>
