<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680">
  <defs>
    <style>
      .t { fill: #e6edf3; font: 700 18px "Segoe UI","Microsoft YaHei",sans-serif; }
      .s { fill: #8b949e; font: 11px "Segoe UI","Microsoft YaHei",sans-serif; }
      .n { fill: #e6edf3; font: 600 12px "Segoe UI","Microsoft YaHei",sans-serif; }
      .d { fill: #8b949e; font: 10px "Segoe UI","Microsoft YaHei",sans-serif; }
      .e { fill: #8b949e; font: 10px "Segoe UI","Microsoft YaHei",sans-serif; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>
  <rect width="1080" height="680" fill="#0d1117"/>
  <text class="t" x="28" y="32">expense · custom-import</text>
  <text class="s" x="28" y="52">文件登记走 CLI；表单当场落明细</text>

  <rect x="40" y="80" width="240" height="56" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="52" y="106">HTTP 导入入口</text>
<text class="d" x="52" y="122">actionImport / expenseImport</text>
  <polygon points="430,62 538,108 430,154 322,108" fill="#161b22" stroke="#d29922"/>
