<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1320" width="1440" height="1320">
  <defs>
    <style>
      .title{fill:#e6edf3;font:700 22px "Segoe UI",sans-serif}
      .sub{fill:#8b949e;font:12px "Segoe UI",sans-serif}
      .hs{fill:#58a6ff;font:700 15px "Segoe UI",sans-serif}
      .hm{fill:#d2a8ff;font:700 15px "Segoe UI",sans-serif}
      .n{fill:#e6edf3;font:600 11px "Segoe UI",sans-serif}
      .d{fill:#8b949e;font:10px "Segoe UI",sans-serif}
      .ls{fill:none;stroke:#388bfd;stroke-width:1.4}
      .lm{fill:none;stroke:#a371f7;stroke-width:1.4}
    </style>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#388bfd"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
  </defs>
  <rect width="1440" height="1320" fill="#0d1117"/>
  <text class="title" x="28" y="34">TiktokAllOperatorChain - first 12 operators by branch</text>
  <text class="sub" x="28" y="56">Definition: first 12 entries in the array returned by apply(); every entry is shown explicitly</text>
  <polygon points="720,86 940,146 720,206 500,146" fill="#161b22" stroke="#d29922"/>
  <text class="n" text-anchor="middle" x="720" y="137">$this-&gt;order-&gt;build_order_type</text>
  <text class="d" text-anchor="middle" x="720" y="157">== BuildOrderTypeEnum::SYSTEM / MANUAL</text>
  <text class="d" text-anchor="middle" x="720" y="177">SYSTEM=0 / MANUAL=1</text>
  <text class="hs" x="80" y="242">SYSTEM = 0 - TikTok platform prefix</text>
  <text class="hm" x="800" y="242">MANUAL = 1 - six manual + six common entries</text>

  <rect x="80" y="264" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="288">01 TiktokFullSettlementExpense</text>
  <text class="d" x="96" y="307">isOnlyCalItemStat / empty($transactions) / type == 'ORDER'</text>
  <rect x="80" y="344" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="368">02 TiktokSalesRevenue</text>
  <text class="d" x="96" y="387">PlatformOrderSkipRule; EU site subtracts product tax</text>
  <rect x="80" y="424" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="448">03 TiktokPlatformCancelRefundAmount</text>
  <text class="d" x="96" y="467">platform_order_status == 54 and shipping_status == 1</text>
  <rect x="80" y="504" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="528">04 TiktokPlatformCancelRefundSellerDiscountPrice</text>
  <text class="d" x="96" y="547">is_null($refundAmount) -&gt; skip</text>
  <rect x="80" y="584" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="608">05 TiktokTaxRevenue</text>
  <text class="d" x="96" y="627">$siteConfig and in_array($order['site'], custom_conf)</text>
  <rect x="80" y="664" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="688">06 TiktokShippingFeeRevenue</text>
  <text class="d" x="96" y="707">isSkipSettlement($order); current implementation returns false</text>
  <rect x="80" y="744" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="768">07 TiktokShippingFeeSellerDiscount</text>
  <text class="d" x="96" y="787">isSkipSettlement($order); write negative seller discount</text>
  <rect x="80" y="824" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="848">08 TiktokDeductionTaxRevenue</text>
  <text class="d" x="96" y="867">if ($sstTax) -&gt; settlement report source</text>
  <rect x="80" y="904" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="928">09 TiktokPlatformDiscountPrice</text>
  <text class="d" x="96" y="947">return -ArrayHelper::getValue($item, 'platform_discount')</text>
  <rect x="80" y="984" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="1008">10 TiktokPlatformOtherExpenseDiscount</text>
  <text class="d" x="96" y="1027">return ArrayHelper::getValue($item, 'platform_discount')</text>
  <rect x="80" y="1064" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="1088">11 TiktokSellerDiscountPrice</text>
  <text class="d" x="96" y="1107">return -ArrayHelper::getValue($item, 'seller_discount')</text>
  <rect x="80" y="1144" width="560" height="58" rx="8" fill="#12233a" stroke="#388bfd"/>
  <text class="n" x="96" y="1168">12 TiktokRetailDeliveryOtherRevenue</text>
  <text class="d" x="96" y="1187">return ArrayHelper::getValue($item, 'retail_delivery_fee')</text>

  <rect x="800" y="264" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="288">01 ShippedSettlement</text>
  <text class="d" x="816" y="307">shipping_status == BoolEnum::YES -&gt; settlement()</text>
  <rect x="800" y="344" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="368">02 ManualSalesRevenue</text>
  <text class="d" x="816" y="387">manual sales revenue; ComplexSkipRule</text>
  <rect x="800" y="424" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="448">03 ManualFreight</text>
  <text class="d" x="816" y="467">original_order_amount_cny == 0 or shipping_revenue == 0</text>
  <rect x="800" y="504" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="528">04 ManualDiscountedPrice</text>
  <text class="d" x="816" y="547">setFee(-abs($discountAmount))</text>
  <rect x="800" y="584" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="608">05 SystemVatDeductCustomerTax</text>
  <text class="d" x="816" y="627">amount == 0 / empty($setting) / $tax == 0 -&gt; skip</text>
  <rect x="800" y="664" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="688">06 RefundAmount</text>
  <text class="d" x="816" y="707">settlement refund exists / refundAmount == 0 -&gt; skip</text>
  <rect x="800" y="744" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="768">07 TikTokShippedSettlement</text>
  <text class="d" x="816" y="787">$orgOrder and $orgOrder['is_sample_order'] means do not skip</text>
  <rect x="800" y="824" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="848">08 MultiChannelSettlementExpense</text>
  <text class="d" x="816" y="867">empty($multiOrder) / no overseas_wms_out_number -&gt; skip</text>
  <rect x="800" y="904" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="928">09 AmazonMultiChannelOrderV2Operator</text>
  <text class="d" x="816" y="947">platform_id != PlatformEnum::AMAZON -&gt; TikTok always skips</text>
  <rect x="800" y="984" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="1008">10 TiktokEstimateHistoryFBAOperate</text>
  <text class="d" x="816" y="1027">stage != ESTIMATE / no TK_TIKTOK -&gt; skip</text>
  <rect x="800" y="1064" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="1088">11 InitialPurchaseCost</text>
  <text class="d" x="816" y="1107">hasOrderExclude / exchange_rate == 0 -&gt; skip</text>
  <rect x="800" y="1144" width="560" height="58" rx="8" fill="#211831" stroke="#a371f7"/>
  <text class="n" x="816" y="1168">12 TradeCommission</text>
  <text class="d" x="816" y="1187">order_amount == 0; only settled SYSTEM TikTok skips</text>

  <rect x="80" y="1230" width="1280" height="54" rx="8" fill="#12261e" stroke="#3fb950"/>
  <text class="n" text-anchor="middle" x="720" y="1254">Both branches continue with later apply() entries and write order_expense_item_stats</text>
  <text class="d" text-anchor="middle" x="720" y="1272">This boundary means first 12 entries, not the end of the chain</text>

  <path class="ls" d="M500 146H360V264" marker-end="url(#sa)"/>
  <path class="lm" d="M940 146H1080V264" marker-end="url(#ma)"/>
  <path class="ls" d="M360 322V344M360 402V424M360 482V504M360 562V584M360 642V664M360 722V744M360 802V824M360 882V904M360 962V984M360 1042V1064M360 1122V1144M360 1202V1230" marker-end="url(#sa)"/>
  <path class="lm" d="M1080 322V344M1080 402V424M1080 482V504M1080 562V584M1080 642V664M1080 722V744M1080 802V824M1080 882V904M1080 962V984M1080 1042V1064M1080 1122V1144M1080 1202V1230" marker-end="url(#ma)"/>
</svg>
